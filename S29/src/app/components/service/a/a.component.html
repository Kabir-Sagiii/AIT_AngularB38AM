<div class="container mt-5">
  <div class="row">
    <div class="col-12">
      <h2>A Component</h2>
    </div>
  </div>

  <div class="row my-3">
    <div class="col-4">
      <input
        [(ngModel)]="data"
        type="text"
        placeholder="enter something"
        class="form-control"
      />
    </div>
    <div class="col-3">
      <button (click)="getAData()" type="button" class="btn btn-success">
        Submit
      </button>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <p class="lead text-success"></p>
    </div>
  </div>
</div>
